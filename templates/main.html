<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ТехноКад</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/administration.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/schedule.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reports.css') }}">
</head>

<body class="theme1 page-enter">

    <header>
        <div class="topbar">
            <div class="topbar-right">
                {% include "profile.html" %}
            </div>
        </div>
    </header>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">
                <span class="techno">Техно</span>
                <span class="kad-wrap">
                    <svg class="circle" viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="50"></circle>
                    </svg>
                    <span class="kad">Кад</span>
                </span>
            </div>

            <nav class="menu">

                <a href="#" data-page="admin" id="adminLink">
                    <span class="icon">
                        <img src="{{ url_for('static', filename='img/icon_administration.png') }}">
                    </span>
                    Администрирование
                </a>

                <a href="#" data-page="vacation" id="vacationLink">
                    <span class="icon">
                        <img src="{{ url_for('static', filename='img/icon_shedule.png') }}">
                    </span>
                    График отпусков
                </a>

                <a href="#" data-page="reports" id="reportLink">
                    <span class="icon">
                        <img src="{{ url_for('static', filename='img/icon_report.png') }}">
                    </span>
                    Формирование отчетов
                </a>

                <a href="#" data-page="export">
                    <span class="icon">
                        <img src="{{ url_for('static', filename='img/icon_print.png') }}">
                    </span>
                    Выгрузка
                </a>

                <a href="#" data-page="user-guide">
                    <span class="icon">
                        <img src="{{ url_for('static', filename='img/icon_guide_user.png') }}">
                    </span>
                    Руководство пользователя
                </a>

                <a href="#" data-page="admin-guide" id="manualAdminLink">
                    <span class="icon">
                        <img src="{{ url_for('static', filename='img/icon_guide_admin.png') }}">
                    </span>
                    Руководство администратора
                </a>

                <a href="#" data-page="about" class="about-link">
                    <span class="icon">
                        <img src="{{ url_for('static', filename='img/icon_about.png') }}">
                    </span>
                    О сервисе
                </a>

            </nav>

            <button id="themeToggle" class="theme-btn">
                <img src="{{ url_for('static', filename='img/icon_theme.png') }}">
            </button>

        </aside>

        <main class="content">
            <div id="page-content" class="page section">
                <h2>Добро пожаловать</h2>
            </div>
        </main>

    </div>

    <div id="toastContainer"></div>

    <script>
        window.userRoleId = {{ current_user.role_id | default(1) }};
        window.userDeptId = {{ current_user.department_id | default(0) }};
    </script>

    <script src="{{ url_for('static', filename='js/administration.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=20260921"></script>
    <script src="{{ url_for('static', filename='js/profile.js') }}"></script>
    <script src="{{ url_for('static', filename='js/permissions.js') }}"></script>
    <script src="{{ url_for('static', filename='js/schedule.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reports.js') }}"></script>

</body>
</html>
