<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ссылка недействительна</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            color: #333;
        }

        .container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #4a4a4a;
            font-size: 28px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Ссылка недействительна</h1>

        <p>
            Ссылка недействительна или срок её действия истёк.
        </p>

        <p>
            Попробуйте зарегистрироваться снова или запросите новое письмо.
        </p>

        <button onclick="window.location.href='/'">
            Вернуться на страницу входа
        </button>
    </div>
</body>
</html>
